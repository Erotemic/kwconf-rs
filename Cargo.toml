[workspace]
members = [
    "crates/kwconf",
    "crates/kwconf_derive",
]
resolver = "3"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kitware/kwconf-rs"
rust-version = "1.85"

[workspace.dependencies]
serde = "1"
serde_core = "1"
serde_json = "1"
# Keep clap's polished default help/error behavior, but depend directly on the
# builder crate so ordinary kwconf users do not compile clap's front crate.
clap = { package = "clap_builder", version = "4.6", features = ["string"] }
clap_complete = "4.6"
# kwconf only reads TOML. Disabling `display` avoids compiling toml_writer.
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }
yaml_serde = "0.10"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
